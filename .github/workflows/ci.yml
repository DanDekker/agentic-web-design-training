name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Bun tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run tests
        run: bun test

  container:
    name: Build and smoke test container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --pull --tag gauntlet-web:ci .
      - name: Smoke test HTTP server
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --publish 127.0.0.1:4317:3000 gauntlet-web:ci)
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4317/api/health >/dev/null; then
              curl --fail --silent http://127.0.0.1:4317/ >/dev/null
              curl --fail --silent --show-error \
                -H 'content-type: application/json' \
                --data '{"html":"<meta name=robots content=noindex>"}' \
                http://127.0.0.1:4317/api/seo/audit |
                python3 -c 'import json, sys; assert json.load(sys.stdin)["robotsMeta"]["googleSearch"]["noindex"] is True'
              curl --fail --silent --show-error \
                -H 'content-type: application/json' \
                --data '{"taskId":"task_refactor_async_pipeline","code":"async function processUserData(id) { const [user, prefs, activity] = await Promise.all([fetchUser(id), fetchUserPreferences(id), fetchRecentActivity(id)]); return { user, prefs, score: await calculateScore(activity) }; }"}' \
                http://127.0.0.1:4317/api/curriculum/evaluate |
                python3 -c 'import json, sys; assert json.load(sys.stdin)["passed"] is True'
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
